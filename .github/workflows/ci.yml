name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: server (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run basedpyright
      - run: uv run pytest

  client:
    name: client (fmt, lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum

      - name: Ensure build deps (X11 headers for golang.design/x/hotkey)
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "$out"
            exit 1
          fi

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.14.0

      - run: golangci-lint run --config ../.golangci.yml
      - run: golangci-lint run --config ../.golangci.yml --build-tags "desktop purego"
      - run: go test ./...

      - name: Build the desktop shell (purego, no GTK dev headers)
        run: go build -tags "desktop purego" ./...

  packaging-windows:
    name: packaging (windows setup)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile the setup from placeholder artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content -LiteralPath dist\kitsune-client.exe -Value 'placeholder'
          Set-Content -LiteralPath dist\kitsune-server_windows_amd64.tar.gz -Value 'placeholder'
          ./packaging/windows/build-installer.ps1 `
            -Client dist\kitsune-client.exe `
            -ServerArtifact dist\kitsune-server_windows_amd64.tar.gz `
            -Version dev -Output dist

      - name: Parse the PowerShell entry points
        shell: pwsh
        run: |
          foreach ($path in @('install.ps1', 'packaging/windows/setup.ps1', 'packaging/windows/build-installer.ps1')) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $path), [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | Format-List Message, Extent | Out-String | Write-Error
              exit 1
            }
          }

