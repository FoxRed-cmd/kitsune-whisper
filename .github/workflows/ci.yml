name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: server (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run basedpyright
      - run: uv run pytest

  contract:
    name: contract (openapi and generated types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install the Server environment
        working-directory: server
        run: uv sync --frozen

      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.2

      - name: Regenerate the wire contract
        run: |
          set -euo pipefail
          (cd server && uv run python -m kitsune_server.openapi)
          "$(go env GOPATH)/bin/oapi-codegen" \
            -config client/oapi-codegen.yaml server/openapi.json

      - name: Fail on drift
        run: git diff --exit-code -- server/openapi.json client/internal/api/api.gen.go

  client:
    name: client (fmt, lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum

      - name: Ensure build deps (X11 headers for golang.design/x/hotkey)
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "$out"
            exit 1
          fi

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.14.0

      - run: golangci-lint run --config ../.golangci.yml
      - run: golangci-lint run --config ../.golangci.yml --build-tags "desktop purego"
      - run: go test ./...

      - name: Build the desktop shell (purego, no GTK dev headers)
        run: go build -tags "desktop purego" ./...

  install-smoke-linux:
    name: install smoke (linux container)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Ensure build deps (X11 headers for golang.design/x/hotkey)
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Resolve a standalone 3.11 runtime and the Server environment
        run: |
          set -euo pipefail
          uv python install 3.11
          uv venv --python 3.11 .bundle-venv
          uv pip install --python .bundle-venv/bin/python ./server
          echo "KITSUNE_SERVER_RUNTIME=$(dirname "$(dirname "$(uv python find 3.11)")")" >> "$GITHUB_ENV"
          echo "KITSUNE_SERVER_SITE_PACKAGES=$(ls -d .bundle-venv/lib/python3.11/site-packages)" >> "$GITHUB_ENV"
          echo "KITSUNE_SERVER_PYTHON=.bundle-venv/bin/python" >> "$GITHUB_ENV"

      - name: Build and sign a throwaway artifact set
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          scripts/build-linux-artifacts.sh --output dist --version "$version"
          cp install.sh dist/install.sh
          (cd dist && sha256sum install.sh >> checksums.txt)
          umask 077
          openssl ecparam -name prime256v1 -genkey -noout -out "$RUNNER_TEMP/ci-signing-key.pem"
          openssl ec -in "$RUNNER_TEMP/ci-signing-key.pem" -pubout -out dist/ci-public-key.pem
          chmod 644 dist/ci-public-key.pem
          scripts/sign-release-checksums.sh \
            --key "$RUNNER_TEMP/ci-signing-key.pem" \
            --checksums dist/checksums.txt \
            --public-key dist/ci-public-key.pem
          rm -f "$RUNNER_TEMP/ci-signing-key.pem"

      - name: Install from local artifacts in a clean container
        env:
          KITSUNE_CONTAINER_ENGINE: docker
        run: |
          set -euo pipefail
          scripts/ci-install-smoke.sh --container \
            --artifacts dist \
            --version "$(cat VERSION)" \
            --public-key dist/ci-public-key.pem

  install-smoke-windows:
    name: install smoke (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum

      - name: Ensure a C compiler
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw --no-progress -y
          }

      - name: Build the Client zip
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          ./packaging/windows/build-client.ps1 -Version $version -Output dist/kitsune-client.exe -Console
          Copy-Item kitsune.example.yaml dist/
          Compress-Archive -Path dist/kitsune-client.exe, dist/kitsune.example.yaml `
            -DestinationPath "dist/kitsune-client_windows_amd64.zip" -Force
          Remove-Item dist/kitsune-client.exe, dist/kitsune.example.yaml

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Resolve a standalone 3.11 runtime and build the Server bundle
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          uv python install 3.11
          $python = (uv python find 3.11).Trim()
          $runtime = Split-Path -Parent $python
          if (-not (Test-Path -LiteralPath (Join-Path $runtime "pythonw.exe"))) {
            throw "the standalone runtime has no pythonw.exe, so the Server cannot start hidden"
          }
          uv venv --python 3.11 .bundle-venv
          uv pip install --python .bundle-venv\Scripts\python.exe ./server
          $sitePackages = (Resolve-Path -LiteralPath .bundle-venv\Lib\site-packages).Path
          & .bundle-venv\Scripts\python.exe -m kitsune_server bundle build `
            --output dist/kitsune-server_windows_amd64.tar.gz `
            --runtime $runtime `
            --site-packages $sitePackages `
            --platform windows --arch amd64 --version $version

      - name: Generate checksums and sign them with an ephemeral key
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item install.ps1 dist/install.ps1
          $files = Get-ChildItem -LiteralPath dist -File |
            Where-Object { $_.Name -like 'kitsune-*' -or $_.Name -eq 'install.ps1' } |
            Sort-Object Name
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          Set-Content -LiteralPath dist/checksums.txt -Value $lines -Encoding ascii
          $ecdsa = [System.Security.Cryptography.ECDsa]::Create(
            [System.Security.Cryptography.ECCurve]::CreateFromFriendlyName('nistP256'))
          try {
            $signature = $ecdsa.SignData(
              [System.IO.File]::ReadAllBytes((Join-Path $PWD 'dist/checksums.txt')),
              [System.Security.Cryptography.HashAlgorithmName]::SHA256,
              [System.Security.Cryptography.DSASignatureFormat]::Rfc3279DerSequence)
            [System.IO.File]::WriteAllBytes((Join-Path $PWD 'dist/checksums.txt.sig'), $signature)
            [System.IO.File]::WriteAllText(
              (Join-Path $PWD 'dist/ci-public-key.pem'),
              $ecdsa.ExportSubjectPublicKeyInfoPem())
          }
          finally {
            $ecdsa.Dispose()
          }

      - name: Install from local artifacts and assert the result
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          pwsh -NoProfile -File scripts/ci-install-smoke.ps1 -Artifacts dist -Version $version

  packaging-windows:
    name: packaging (windows scripts)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse the remaining PowerShell entry points
        shell: pwsh
        run: |
          foreach ($path in @('install.ps1', 'packaging/windows/build-client.ps1', 'scripts/ci-install-smoke.ps1')) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $path), [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | Format-List Message, Extent | Out-String | Write-Error
              exit 1
            }
          }
