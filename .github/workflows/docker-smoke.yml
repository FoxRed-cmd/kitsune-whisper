name: Docker smoke

# Opt-in real-container parity check for issue #78. It builds the image,
# downloads the `tiny` model, and runs the authenticated pairing/restart/
# soft-stop flow, so it is deliberately not part of PR CI. Run it by hand or
# let the weekly schedule catch packaging regressions.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 0"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the CPU image
        run: docker build -t kitsune-whisper-server:smoke server
      - name: Run the parity smoke
        run: bash scripts/docker-smoke.sh --image kitsune-whisper-server:smoke --model tiny --no-build
