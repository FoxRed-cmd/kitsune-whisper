name: Publish server image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}-server

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: cpu
            base: python:3.11-slim
            sync_args: ""
          - profile: gpu
            base: nvidia/cuda:12.3.2-cudnn9-runtime-ubuntu22.04
            sync_args: "--extra cuda"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ matrix.profile }},enable={{is_default_branch}}
            type=ref,event=tag,suffix=-${{ matrix.profile }}
            type=sha,format=short,prefix=${{ matrix.profile }}-

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            UV_SYNC_ARGS=${{ matrix.sync_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
