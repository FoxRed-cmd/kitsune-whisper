<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- kitsune-whisper application icon. The fox is the supplied artwork;
       the palette follows the warm Settings accent. AppPNG uses the flat
       sibling app-flat.svg, because the in-process renderer cannot parse the
       gradient, clip path, or filter below. -->
  <defs>
    <clipPath id="squircle">
      <rect width="512" height="512" rx="118.02"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
        <stop offset="0" stop-color="#eaa06c"/>
        <stop offset="0.5" stop-color="#c2703f"/>
        <stop offset="1" stop-color="#8a401b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#f7c9a3" stop-opacity="0.50"/>
      <stop offset="0.55" stop-color="#f7c9a3" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f7c9a3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="1.05" r="0.9">
      <stop offset="0" stop-color="#6e3414" stop-opacity="0.34"/>
      <stop offset="0.65" stop-color="#6e3414" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#6e3414" stop-opacity="0"/>
    </radialGradient>
    <filter id="fox-shadow" x="-30%" y="-30%" width="160%" height="175%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7.5" result="blur"/>
      <feOffset in="blur" dx="0" dy="10" result="offset"/>
      <feFlood flood-color="#2f1608" flood-opacity="0.48" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
