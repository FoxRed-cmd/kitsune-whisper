<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Tray mark: a fox head in a rounded badge. internal/brand resolves
       the variables below from the Settings palette, so each state keeps the
       same shape and only the badge colour changes. The defaults make the file
       previewable as the light-theme recording icon. -->
  <style>
    svg { --state: #4d6bf5; --on-accent: #ffffff; }
  </style>
  <rect width="64" height="64" rx="15" fill="var(--state)"/>
  <path fill="var(--on-accent)" d="M10.5 9 L23.5 24 L32 22 L40.5 24 L53.5 9 L50.5 31 C50 34.5 51 37.5 54 42 L43.5 40.5 C40.5 45 36.5 49 32 53 C27.5 49 23.5 45 20.5 40.5 L10 42 C13 37.5 14 34.5 13.5 31 Z"/>
  <circle cx="24" cy="33" r="2.5" fill="var(--state)"/>
  <circle cx="40" cy="33" r="2.5" fill="var(--state)"/>
  <path fill="var(--state)" d="M32 39 L35 42.4 L32 46 L29 42.4 Z"/>
</svg>
