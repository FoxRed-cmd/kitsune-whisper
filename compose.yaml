name: kitsune-whisper

# CPU runs anywhere; GPU needs the NVIDIA driver plus nvidia-container-toolkit
# (Linux) or GPU support in WSL2 (Windows). See the README for prerequisites.
#
#   cp kitsune.example.yaml config/kitsune.yaml
#   docker compose --profile cpu up -d
#   docker compose --profile gpu up -d
#
# The host port is 8765 unless `.env` sets KITSUNE_HOST_PORT. The container
# always listens on 8765; the healthcheck reads the same port.
#
# State lives on named volumes so a recreated container keeps its identity:
#   kitsune-models  /models  Whisper model dirs and the llama.cpp GGUF
#   kitsune-state   /state   TLS cert/key, Device and pairing stores,
#                            soft-stop lifecycle flag, and the Server log
# The configuration is a writable *directory* bind mount: the Admin API saves
# settings with an atomic rename inside /config, which a single-file mount
# cannot do. `docker compose down` keeps the volumes; `down -v` deletes them
# (and every paired Device, so each Client must pair again).
#
# Optional bundled local LLM (Refine/Summarize), no build step: start the
# Server together with the matching sidecar. Targeting both services starts
# exactly those two (and auto-enables their profiles):
#
#   docker compose up -d server-cpu llama-cpu
#   docker compose up -d server-gpu llama-gpu
#
# The sidecar serves the default Qwen3 GGUF into the shared models volume. Tune
# it from a `.env` file next to this one: LLM_MODEL_REPO, LLM_MODEL_FILE,
# LLM_GPU_LAYERS, LLM_OFFLINE. Server-side Refine/Summarize also needs
# `server.processing.enabled: true` in config/kitsune.yaml.

x-nvidia-gpu: &nvidia-gpu
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [gpu]

x-server: &server
  restart: unless-stopped
  ports:
    - "${KITSUNE_HOST_PORT:-8765}:8765"
  environment:
    # docker exec does not inherit CMD, so pin the file here as well: `pair`
    # then reads exactly what the running Server reads.
    KITSUNE_CONFIG: /config/kitsune.yaml
    # Point Refine/Summarize at the bundled sidecar. Harmless when the `llm`
    # profile is off: processing stays disabled until kitsune.yaml enables it.
    KITSUNE_SERVER_PROCESSING__BASE_URL: http://llama:8080
    # Keep the self-signed TLS identity, the Device allow-list, the pairing
    # codes, the soft-stop flag, and the log on a volume, so a recreated
    # container keeps the fingerprint, the paired Devices, and the Server's
    # deliberate stopped state.
    KITSUNE_SERVER_TLS__CERT_FILE: /state/tls/server.crt
    KITSUNE_SERVER_TLS__KEY_FILE: /state/tls/server.key
    KITSUNE_SERVER_DEVICES_FILE: /state/devices.json
    XDG_STATE_HOME: /state
  volumes:
    - type: bind
      source: ./config
      target: /config
      bind:
        create_host_path: false
        selinux: z
    - kitsune-models:/models
    - kitsune-state:/state

x-llama: &llama
  restart: unless-stopped
  profiles: ["llm"]
  networks:
    default:
      aliases:
        - llama
  environment:
    # Keep the GGUF beside the Whisper models in the shared volume, so restarts
    # reuse the download.
    LLAMA_CACHE: /models/llama
  volumes:
    - kitsune-models:/models
  # Model repo/file, -ngl offload, and offline are .env-overridable flags; -1
  # offloads all layers the device can hold and is ignored on the CPU image.
  # `--reasoning off` disables Qwen3 thinking in the template so Refine/
  # Summarize answer directly; the Server then sends the same portable request
  # to any OpenAI-compatible provider.
  command: >
    --host 0.0.0.0 --port 8080
    -hf ${LLM_MODEL_REPO:-Qwen/Qwen3-0.6B-GGUF}
    -hff ${LLM_MODEL_FILE:-Qwen3-0.6B-Q8_0.gguf}
    -ngl ${LLM_GPU_LAYERS:--1}
    --jinja --reasoning off
    ${LLM_OFFLINE:+--offline}
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
    interval: 30s
    timeout: 5s
    start_period: 300s
    retries: 3

services:
  server-cpu:
    <<: *server
    profiles: ["cpu"]
    image: ghcr.io/foxred-cmd/kitsune-whisper-server:cpu
    build:
      context: ./server
      args:
        BASE_IMAGE: python:3.11-slim

  server-gpu:
    <<: *server
    profiles: ["gpu"]
    image: ghcr.io/foxred-cmd/kitsune-whisper-server:gpu
    build:
      context: ./server
      args:
        BASE_IMAGE: nvidia/cuda:12.3.2-cudnn9-runtime-ubuntu22.04
        UV_SYNC_ARGS: "--extra cuda"
    deploy: *nvidia-gpu

  llama-cpu:
    <<: *llama
    image: ghcr.io/ggml-org/llama.cpp:server

  llama-gpu:
    <<: *llama
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    deploy: *nvidia-gpu

volumes:
  kitsune-models:
  kitsune-state:
