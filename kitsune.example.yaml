# kitsune-whisper configuration template.
#
# Copy this file to `kitsune.yaml` and edit it. The Docker Server mounts it at
# /config/kitsune.yaml, and the Client will read the same file. Each process
# reads only its own section, and unknown keys are a startup error, so keep
# typos out.

server:
  host: 0.0.0.0
  port: 8000
  # Model size (tiny/base/small/medium/large-v3) or a local CTranslate2 path.
  # GPU is recommended; on CPU use base/tiny for lower latency.
  model: small
  # auto resolves CUDA when available, else CPU (see docs/adr/0003).
  device: auto
  compute_type: auto
  # 0 lets the server size its worker pool from the resolved device.
  workers: 0
  # The Docker image overrides this with KITSUNE_SERVER_DOWNLOAD_ROOT=/models,
  # which lives on a named volume that persists between runs.
  download_root: ~/.cache/kitsune-whisper/models
  offline: false
  max_audio_seconds: 300
  max_upload_mb: 30
  log_level: info
  decode:
    task: transcribe
    language: auto
    beam_size: 5
    temperature: 0.0
    vad_filter: false
    initial_prompt: ""

client:
  # The Client addresses the Server here; the top-level server: section above
  # is the Server process's own config and is not read by the Client.
  server_url: http://localhost:8000
  hotkey: Ctrl+Shift+Space
  cancel_hotkey: Esc
  # toggle (press to start, press again to stop) or hold (push-to-talk).
  trigger: toggle
  max_recording_seconds: 300
  # Recordings shorter than this are discarded as accidental taps.
  min_recording_seconds: 0.3
  # 0 selects max(30s, 2 x audio length).
  timeout_seconds: 0
  # Sent per request only when set to something other than "auto".
  language: auto
  initial_prompt: ""
  audio:
    # "" = system default input.
    device: ""
  # Synthesize the paste after writing the clipboard; false is clipboard-only.
  paste: true
  # auto | ctrl_v | ctrl_shift_v (auto picks ctrl_shift_v in terminals).
  paste_shortcut: auto
  # auto | always | never. auto restores the previous clipboard on Linux/X11 and
  # keeps the transcription on Windows, where the OS never reports when a
  # synthetic paste is consumed and safe restore is impossible. always is a
  # best-effort restore even there; never always keeps the transcription.
  clipboard_restore: auto
  feedback:
    earcons: false
  # "" = default cache path (~/.cache/kitsune-whisper/spool).
  spool_dir: ""
  log_level: info
  # "" = default log path (~/.cache/kitsune-whisper/client.log).
  log_file: ""
