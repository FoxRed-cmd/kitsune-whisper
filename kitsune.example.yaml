# kitsune-whisper configuration template.
#
# Copy this file to `kitsune.yaml` and edit it. The Docker Server mounts it at
# /config/kitsune.yaml, and the Client will read the same file. Each process
# reads only its own section, and unknown keys are a startup error, so keep
# typos out.

server:
  host: 0.0.0.0
  port: 8000
  # Model size (tiny/base/small/medium/large-v3) or a local CTranslate2 path.
  # GPU is recommended; on CPU use base/tiny for lower latency.
  model: small
  # auto resolves CUDA when available, else CPU (see docs/adr/0003).
  device: auto
  compute_type: auto
  # 0 lets the server size its worker pool from the resolved device.
  workers: 0
  # The Docker image overrides this with KITSUNE_SERVER_DOWNLOAD_ROOT=/models,
  # which lives on a named volume that persists between runs.
  download_root: ~/.cache/kitsune-whisper/models
  offline: false
  max_audio_seconds: 300
  max_upload_mb: 30
  log_level: info
  decode:
    task: transcribe
    language: auto
    beam_size: 5
    temperature: 0.0
    # Server-side VAD is the authoritative silence gate; keep it on so silent
    # clips return empty text instead of hallucinated words (see #10).
    vad_filter: true
    initial_prompt: ""
  # Optional Refine/Summarize post-processing over an OpenAI-compatible
  # endpoint. Off by default: when off, or when a request does not ask for it,
  # /transcribe behaves exactly as before. A request may ask for refine and/or
  # summarize; when both are set, Refine runs first, then Summarize. The Server
  # posts standard chat completions to {base_url}/v1/chat/completions, so it
  # works with the bundled llama.cpp sidecar (the compose `llm` profile, which
  # sets base_url to http://llama:8080), Ollama, LM Studio, or a cloud API.
  processing:
    enabled: false
    # Loopback by default, so processing stays local unless you point it at an
    # external provider. Note: an external base_url sends text off the host.
    base_url: http://127.0.0.1:8080
    # Sent as `Authorization: Bearer` when set; leave unset for a local sidecar.
    api_key: null
    # Model name sent to the endpoint (the sidecar ignores it and serves its
    # loaded GGUF). Set it for providers like Ollama or a cloud API.
    model: Qwen3-0.6B-Q8_0.gguf
    # Extra keys merged into each request, e.g. to disable a provider's thinking
    # mode: {chat_template_kwargs: {enable_thinking: false}}.
    extra_body: {}
    # Per-utterance cap on generated tokens.
    max_output_tokens: 1024
    # Per-stage timeout; a stage that exceeds it degrades to the previous text.
    stage_timeout_seconds: 30

client:
  # The Client addresses the Server here; the top-level server: section above
  # is the Server process's own config and is not read by the Client.
  server_url: http://localhost:8000
  hotkey: Ctrl+Shift+Space
  # auto | portal | x11. auto uses the GlobalShortcuts portal on Wayland when
  # available (GNOME >=48 / KDE Plasma >=5.27) and the external trigger
  # (kitsune-client toggle) otherwise; on an X11 session it uses the X11 global
  # grab. Set x11 explicitly to force the XWayland grab on Wayland.
  hotkey_backend: auto
  cancel_hotkey: Esc
  # toggle (press to start, press again to stop) or hold (push-to-talk).
  trigger: toggle
  max_recording_seconds: 300
  # Recordings shorter than this are discarded as accidental taps.
  min_recording_seconds: 0.3
  # 0 selects max(30s, 2 x audio length).
  timeout_seconds: 0
  # Sent per request only when set to something other than "auto".
  language: auto
  initial_prompt: ""
  # Ask the Server to post-process each utterance (needs server.processing
  # enabled). Sent per request only when true. When both are set, Refine runs
  # first, then Summarize.
  refine: false
  summarize: false
  audio:
    # "" = system default input.
    device: ""
  # Synthesize the paste after writing the clipboard; false is clipboard-only.
  paste: true
  # auto | ctrl_v | ctrl_shift_v | shift_insert (auto picks ctrl_shift_v in
  # terminals and ctrl_v elsewhere; shift_insert is the classic console chord
  # and also publishes to the X11/Wayland primary selection).
  paste_shortcut: auto
  # auto | always | never. auto restores the previous clipboard on Linux/X11 and
  # keeps the transcription on Windows, where the OS never reports when a
  # synthetic paste is consumed and safe restore is impossible. always is a
  # best-effort restore even there; never always keeps the transcription.
  clipboard_restore: auto
  # auto | wtype | ydotool | none. Wayland injection tries wtype, then ydotool,
  # then falls back to clipboard-only. ydotool is used only when already
  # installed; it is never bundled. Ignored on X11/Windows.
  wayland_tool: auto
  feedback:
    earcons: false
  # "" = default cache path (~/.cache/kitsune-whisper/spool).
  spool_dir: ""
  log_level: info
  # "" = default log path (~/.cache/kitsune-whisper/client.log).
  log_file: ""
