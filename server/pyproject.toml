[project]
name = "kitsune-server"
version = "0.1.0"
description = "kitsune-whisper transcription Server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "av>=12,<19",
    "faster-whisper==1.2.1",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12>=12,<13",
]
processing = [
    "llama-cpp-python>=0.3,<0.4",
]

[project.scripts]
kitsune-server = "kitsune_server.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "basedpyright>=1.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kitsune_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
extraPaths = [".", "tests"]
typeCheckingMode = "standard"
reportImplicitRelativeImport = "none"
